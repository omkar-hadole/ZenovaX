# AWS Amplify Hosting build spec (monorepo).
# The repo holds both `frontend/` and `backend/`; Amplify only builds & hosts
# the frontend. `appRoot: frontend` tells Amplify where the app lives.
# Amplify auto-deploys on every push to the connected branch.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # VITE_API_URL is injected from the Amplify app's environment variables
            # (Console → App settings → Environment variables). Set it to the
            # API Gateway URL from the SAM deploy, e.g. https://xxxx.execute-api.<region>.amazonaws.com/api
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
