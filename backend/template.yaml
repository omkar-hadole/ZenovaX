AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ZenovaX backend — Express app running on AWS Lambda behind an HTTP API Gateway.
  Deploy with:  sam build  &&  sam deploy --guided

# ---------------------------------------------------------------------------
# Parameters — secrets/config passed in at deploy time.
# For production, prefer storing these in SSM Parameter Store / Secrets Manager
# and referencing them, rather than passing raw values on the command line.
# ---------------------------------------------------------------------------
Parameters:
  DatabaseUrl:        { Type: String, NoEcho: true }
  DirectUrl:          { Type: String, NoEcho: true }
  JwtSecret:          { Type: String, NoEcho: true }
  CsrfSecret:         { Type: String, NoEcho: true }
  RedisUrl:           { Type: String, NoEcho: true, Default: "" }
  AllowedOrigins:     { Type: String, Default: "" }   # comma-separated, e.g. https://main.xxxx.amplifyapp.com
  CloudinaryCloudName:{ Type: String, Default: "" }
  CloudinaryApiKey:   { Type: String, NoEcho: true, Default: "" }
  CloudinaryApiSecret:{ Type: String, NoEcho: true, Default: "" }
  GeminiApiKey:       { Type: String, NoEcho: true, Default: "" }
  EmailService:       { Type: String, Default: "gmail" }
  EmailUser:          { Type: String, Default: "" }
  EmailPass:          { Type: String, NoEcho: true, Default: "" }
  EmailFrom:          { Type: String, Default: "" }
  FrontendUrl:        { Type: String, Default: "" }   # base URL of the React app; used in emails + CORS
  SentryDsn:          { Type: String, Default: "" }
  PistonApiUrl:       { Type: String, Default: "https://emkc.org/api/v2/piston" }
  JaasAppId:          { Type: String, Default: "" }
  JaasApiKeyId:       { Type: String, Default: "" }
  JaasPrivateKey:     { Type: String, NoEcho: true, Default: "" }
  RazorpayKeyId:      { Type: String, Default: "" }
  RazorpayKeySecret:  { Type: String, NoEcho: true, Default: "" }
  RazorpayWebhookSecret: { Type: String, NoEcho: true, Default: "" }
  PlatformFeePercent: { Type: Number, Default: 15 }
  BookingHoldMinutes: { Type: Number, Default: 15 }

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 1024
    Timeout: 30            # matches the app's connect-timeout('30s')
    Architectures: [arm64] # Graviton — cheaper & faster; switch to x86_64 if needed
    Environment:
      Variables:
        NODE_ENV: production
        DATABASE_URL: !Ref DatabaseUrl
        DIRECT_URL: !Ref DirectUrl
        JWT_SECRET: !Ref JwtSecret
        CSRF_SECRET: !Ref CsrfSecret
        REDIS_URL: !Ref RedisUrl
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        CLOUDINARY_CLOUD_NAME: !Ref CloudinaryCloudName
        CLOUDINARY_API_KEY: !Ref CloudinaryApiKey
        CLOUDINARY_API_SECRET: !Ref CloudinaryApiSecret
        GEMINI_API_KEY: !Ref GeminiApiKey
        EMAIL_SERVICE: !Ref EmailService
        EMAIL_USER: !Ref EmailUser
        EMAIL_PASS: !Ref EmailPass
        EMAIL_FROM: !Ref EmailFrom
        FRONTEND_URL: !Ref FrontendUrl
        SENTRY_DSN: !Ref SentryDsn
        PISTON_API_URL: !Ref PistonApiUrl
        JAAS_APP_ID: !Ref JaasAppId
        JAAS_API_KEY_ID: !Ref JaasApiKeyId
        JAAS_PRIVATE_KEY: !Ref JaasPrivateKey
        RAZORPAY_KEY_ID: !Ref RazorpayKeyId
        RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret
        RAZORPAY_WEBHOOK_SECRET: !Ref RazorpayWebhookSecret
        PLATFORM_FEE_PERCENT: !Ref PlatformFeePercent
        BOOKING_HOLD_MINUTES: !Ref BookingHoldMinutes

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda.handler
      CodeUri: ./
      Description: ZenovaX Express API (all routes via {proxy+})
      Events:
        # Catch every path + method and forward to Express (like Vercel's rewrite).
        ProxyRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # CORS is handled inside Express (cors middleware) because it needs
      # credentials + dynamic origin checking, so we leave the gateway CORS off.
      PayloadFormatVersion: "2.0"

  # Background maintenance worker. Serverless API functions are frozen after
  # they respond, so they can't keep timers or queue listeners alive — this
  # scheduled function runs the session-completion / earnings-release /
  # booking-cleanup / badge sweep on a cron instead. Deployed from the same
  # CodeUri as the API; only its handler differs.
  BackgroundWorker:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda-worker.handler
      CodeUri: ./
      Description: ZenovaX background maintenance (session completion, earnings, booking sweep, badges)
      MemorySize: 1024
      Timeout: 55
      Events:
        EveryMinute:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)

Outputs:
  ApiUrl:
    Description: Base URL of the deployed API. Set the frontend VITE_API_URL to this value + "/api".
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
