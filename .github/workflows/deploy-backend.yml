name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (runs prisma generate via postinstall)
        working-directory: backend
        run: npm ci

      - name: Remove dev dependencies before packaging
        working-directory: backend
        run: npm prune --omit=dev

      - name: Slim the Prisma footprint for Lambda
        working-directory: backend
        # Build-time bloat that npm prune leaves behind (runtime needs only
        # @prisma/client + the generated .prisma/client):
        #   1. node_modules/prisma       — the Prisma CLI (~88MB, ships 4 engines)
        #   2. node_modules/@prisma/engines (~35MB) — @prisma/client has no deps
        #      and never loads from here; the runtime engine is in .prisma/client.
        #   3. The generated client keeps one engine per binaryTarget. The Lambda
        #      runs on arm64 (see template.yaml), so keep only linux-arm64.
        # Together this takes the zip from ~66MB to ~28MB, well under Lambda's
        # 50MB direct-upload limit — no S3 staging needed.
        run: |
          rm -rf node_modules/prisma node_modules/@prisma/engines
          find node_modules -type f -name 'libquery_engine-*.node' \
            ! -name '*linux-arm64*' -delete
          echo "Remaining engines:"
          find node_modules -name 'libquery_engine-*.node'

      - name: Package function
        working-directory: backend
        run: zip -rq ../function.zip . -x "*.git*" "temp/*" ".env" ".env.example"

      - name: Report artifact size
        run: du -h function.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name zenovax-backend \
            --zip-file fileb://function.zip

      - name: Wait for update to complete
        run: aws lambda wait function-updated --function-name zenovax-backend
