name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (runs prisma generate via postinstall)
        working-directory: backend
        run: npm ci

      - name: Remove dev dependencies before packaging
        working-directory: backend
        run: npm prune --omit=dev

      - name: Slim the Prisma footprint for Lambda
        working-directory: backend
        # Build-time bloat that npm prune leaves behind (runtime needs only
        # @prisma/client + the generated .prisma/client):
        #   1. node_modules/prisma — the Prisma CLI (ships 4 engines + its own
        #      config loader, which since Prisma 6 pulls in the ~33MB `effect`
        #      package via @prisma/config — none of this is used by @prisma/client).
        #   2. node_modules/@prisma/engines, @prisma/config, @prisma/fetch-engine,
        #      @prisma/get-platform, @prisma/debug, @prisma/engines-version — all
        #      CLI-only helper packages; @prisma/client has zero dependencies and
        #      never loads from any of these, the runtime engine lives in .prisma/client.
        #   3. node_modules/effect, c12, deepmerge-ts, empathic — transitive deps
        #      of @prisma/config only, hoisted to top-level by npm so they escape
        #      the node_modules/prisma deletion above.
        #   4. @prisma/client/runtime/*wasm-base64* — since Prisma 6, @prisma/client
        #      bundles WASM query-engine + query-compiler binaries (base64-inlined,
        #      ~2.5-3MB each) for every DB provider (cockroachdb, postgresql, mysql,
        #      sqlserver, sqlite) x2 (.js/.mjs). We use the native binary engine
        #      (see binaryTargets below), never the WASM path, so these are dead
        #      weight regardless of which provider we're on.
        #   5. The generated client keeps one binary engine per binaryTarget. The
        #      Lambda runs on arm64 (see template.yaml), so keep only linux-arm64.
        # Together this takes the zip from ~66MB to ~28-31MB, well under Lambda's
        # 50MB direct-upload limit — no S3 staging needed.
        run: |
          rm -rf node_modules/prisma node_modules/@prisma/engines \
            node_modules/@prisma/config node_modules/@prisma/fetch-engine \
            node_modules/@prisma/get-platform node_modules/@prisma/debug \
            node_modules/@prisma/engines-version \
            node_modules/effect node_modules/c12 node_modules/deepmerge-ts \
            node_modules/empathic
          find node_modules/@prisma/client/runtime -type f \
            -name '*wasm-base64*' -delete 2>/dev/null || true
          # Keep only the arm64 engine for Lambda; remove all other engine binaries
          echo "All engine files before pruning:"
          find node_modules -name 'libquery_engine-*'
          find node_modules -type f -name 'libquery_engine-*' ! -name '*arm64*' -delete
          echo "Remaining engines:"
          find node_modules -name 'libquery_engine-*'
          echo "Remaining engines:"
          find node_modules -name 'libquery_engine-*.node'

      - name: Package function
        working-directory: backend
        run: zip -rq ../function.zip . -x "*.git*" "temp/*" ".env" ".env.example"

      - name: Report artifact size
        run: du -h function.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name zenovax-backend \
            --zip-file fileb://function.zip

      - name: Wait for code update to finish
        # update-function-configuration cannot run while the code update is still
        # InProgress ("ResourceConflictException: An update is in progress").
        # Wait for LastUpdateStatus=Successful before touching configuration.
        run: aws lambda wait function-updated --function-name zenovax-backend

      - name: Update Lambda function configuration (env + runtime)
        # update-function-configuration REPLACES the whole environment, so this
        # mirrors every variable from backend/template.yaml (the source of truth).
        # Keep the two in sync. EMAIL_* / FRONTEND_URL / PISTON_API_URL are what
        # make production emails and code execution actually work.
        #
        # The env map is serialized to JSON with jq and passed via file:// instead
        # of AWS shorthand. The shorthand parser aborts with "Expected ',' received
        # 'EOF'" on multiline secrets (JAAS_PRIVATE_KEY PEM) and on values with
        # quotes/spaces (EMAIL_FROM). Mapping secrets through env: and reading them
        # as $VAR also avoids shell expansion of $ in passwords.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SERVICE: ${{ secrets.EMAIL_SERVICE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PISTON_API_URL: ${{ secrets.PISTON_API_URL }}
          JAAS_APP_ID: ${{ secrets.JAAS_APP_ID }}
          JAAS_API_KEY_ID: ${{ secrets.JAAS_API_KEY_ID }}
          JAAS_PRIVATE_KEY: ${{ secrets.JAAS_PRIVATE_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          PLATFORM_FEE_PERCENT: ${{ secrets.PLATFORM_FEE_PERCENT }}
          BOOKING_HOLD_MINUTES: ${{ secrets.BOOKING_HOLD_MINUTES }}
        run: |
          jq -n \
            --arg NODE_ENV production \
            --arg DATABASE_URL "$DATABASE_URL" \
            --arg DIRECT_URL "$DIRECT_URL" \
            --arg JWT_SECRET "$JWT_SECRET" \
            --arg CSRF_SECRET "$CSRF_SECRET" \
            --arg REDIS_URL "$REDIS_URL" \
            --arg ALLOWED_ORIGINS "$ALLOWED_ORIGINS" \
            --arg CLOUDINARY_CLOUD_NAME "$CLOUDINARY_CLOUD_NAME" \
            --arg CLOUDINARY_API_KEY "$CLOUDINARY_API_KEY" \
            --arg CLOUDINARY_API_SECRET "$CLOUDINARY_API_SECRET" \
            --arg GEMINI_API_KEY "$GEMINI_API_KEY" \
            --arg EMAIL_SERVICE "$EMAIL_SERVICE" \
            --arg EMAIL_USER "$EMAIL_USER" \
            --arg EMAIL_PASS "$EMAIL_PASS" \
            --arg EMAIL_FROM "$EMAIL_FROM" \
            --arg FRONTEND_URL "$FRONTEND_URL" \
            --arg SENTRY_DSN "$SENTRY_DSN" \
            --arg PISTON_API_URL "$PISTON_API_URL" \
            --arg JAAS_APP_ID "$JAAS_APP_ID" \
            --arg JAAS_API_KEY_ID "$JAAS_API_KEY_ID" \
            --arg JAAS_PRIVATE_KEY "$JAAS_PRIVATE_KEY" \
            --arg RAZORPAY_KEY_ID "$RAZORPAY_KEY_ID" \
            --arg RAZORPAY_KEY_SECRET "$RAZORPAY_KEY_SECRET" \
            --arg RAZORPAY_WEBHOOK_SECRET "$RAZORPAY_WEBHOOK_SECRET" \
            --arg PLATFORM_FEE_PERCENT "$PLATFORM_FEE_PERCENT" \
            --arg BOOKING_HOLD_MINUTES "$BOOKING_HOLD_MINUTES" \
            '{Variables: {
              NODE_ENV: $NODE_ENV,
              DATABASE_URL: $DATABASE_URL,
              DIRECT_URL: $DIRECT_URL,
              JWT_SECRET: $JWT_SECRET,
              CSRF_SECRET: $CSRF_SECRET,
              REDIS_URL: $REDIS_URL,
              ALLOWED_ORIGINS: $ALLOWED_ORIGINS,
              CLOUDINARY_CLOUD_NAME: $CLOUDINARY_CLOUD_NAME,
              CLOUDINARY_API_KEY: $CLOUDINARY_API_KEY,
              CLOUDINARY_API_SECRET: $CLOUDINARY_API_SECRET,
              GEMINI_API_KEY: $GEMINI_API_KEY,
              EMAIL_SERVICE: $EMAIL_SERVICE,
              EMAIL_USER: $EMAIL_USER,
              EMAIL_PASS: $EMAIL_PASS,
              EMAIL_FROM: $EMAIL_FROM,
              FRONTEND_URL: $FRONTEND_URL,
              SENTRY_DSN: $SENTRY_DSN,
              PISTON_API_URL: $PISTON_API_URL,
              JAAS_APP_ID: $JAAS_APP_ID,
              JAAS_API_KEY_ID: $JAAS_API_KEY_ID,
              JAAS_PRIVATE_KEY: $JAAS_PRIVATE_KEY,
              RAZORPAY_KEY_ID: $RAZORPAY_KEY_ID,
              RAZORPAY_KEY_SECRET: $RAZORPAY_KEY_SECRET,
              RAZORPAY_WEBHOOK_SECRET: $RAZORPAY_WEBHOOK_SECRET,
              PLATFORM_FEE_PERCENT: $PLATFORM_FEE_PERCENT,
              BOOKING_HOLD_MINUTES: $BOOKING_HOLD_MINUTES
            }}' > /tmp/backend-env.json
          aws lambda update-function-configuration \
            --function-name zenovax-backend \
            --environment file:///tmp/backend-env.json

      - name: Wait for update to complete
        run: aws lambda wait function-updated --function-name zenovax-backend

      - name: Deploy background worker function
        # The maintenance worker (lambda-worker.handler) is new in template.yaml;
        # the same function.zip contains it. Create it on first deploy, otherwise
        # just push code + env. The EventBridge schedule is created next step.
        run: |
          FN=zenovax-background-worker
          if aws lambda get-function --function-name "$FN" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$FN" --zip-file fileb://function.zip
            aws lambda wait function-updated --function-name "$FN"
            aws lambda update-function-configuration --function-name "$FN" --environment file:///tmp/backend-env.json
          else
            aws lambda create-function --function-name "$FN" \
              --runtime nodejs20.x --handler lambda-worker.handler \
              --role "${{ secrets.AWS_LAMBDA_ROLE_ARN }}" \
              --zip-file fileb://function.zip \
              --memory-size 1024 --timeout 55 --architectures arm64 \
              --environment file:///tmp/backend-env.json
          fi

      - name: Ensure worker runs on a schedule
        # Match the `rate(1 minute)` schedule in template.yaml's BackgroundWorker.
        run: |
          FN=zenovax-background-worker
          aws events put-rule --name zenovax-background-worker-schedule \
            --schedule-expression "rate(1 minute)"
          aws events put-targets --rule zenovax-background-worker-schedule \
            --targets "[{\"Id\":\"zenovax-background-worker\",\"Arn\":\"arn:aws:lambda:ap-south-1:$(aws sts get-caller-identity --query Account --output text):function:$FN\"}]"
          aws lambda add-permission --function-name "$FN" \
            --statement-id zenovax-background-worker-events \
            --action lambda:InvokeFunction --principal events.amazonaws.com \
            --source-arn "arn:aws:events:ap-south-1:$(aws sts get-caller-identity --query Account --output text):rule/zenovax-background-worker-schedule" \
            2>/dev/null || true
