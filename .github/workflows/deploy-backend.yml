name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (runs prisma generate via postinstall)
        working-directory: backend
        run: npm ci

      - name: Remove dev dependencies before packaging
        working-directory: backend
        run: npm prune --omit=dev

      - name: Trim unused Prisma engines (keep arm64 only)
        working-directory: backend
        # The Lambda runs on arm64 (see template.yaml), so ship only the
        # linux-arm64 query engine. Dropping the native/musl/rhel binaries
        # takes the zip from ~70MB to ~28MB, under Lambda's 50MB direct-upload limit.
        run: |
          find node_modules/.prisma node_modules/@prisma -type f \
            -name 'libquery_engine-*.node' \
            ! -name '*linux-arm64*' -delete
          echo "Remaining engines:"
          find node_modules -name 'libquery_engine-*.node'

      - name: Package function
        working-directory: backend
        run: zip -rq ../function.zip . -x "*.git*" "temp/*" ".env" ".env.example"

      - name: Report artifact size
        run: du -h function.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name zenovax-backend \
            --zip-file fileb://function.zip

      - name: Wait for update to complete
        run: aws lambda wait function-updated --function-name zenovax-backend
