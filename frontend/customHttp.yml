# Custom response headers for Amplify Hosting (mirrors the old vercel.json caching).
# Hashed Vite assets are immutable and cached for a year; HTML is never cached.
#
# Security headers below are scoped to the external services this app actually
# talks to: 8x8.vc (JaaS video in LiveSession), res.cloudinary.com (images),
# fonts.googleapis.com/fonts.gstatic.com (Google Fonts), cdn.jsdelivr.net
# (Monaco editor's default CDN loader), *.sentry.io (error reporting), and the
# API Gateway backend (region ap-south-1, per deploy-backend.yml). Update the
# execute-api allowance if the backend ever moves region.
customHeaders:
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
      - key: X-Frame-Options
        value: 'DENY'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: Permissions-Policy
        value: 'camera=(self), microphone=(self), geolocation=()'
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://8x8.vc https://cdn.jsdelivr.net;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
          font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;
          img-src 'self' data: blob: https://res.cloudinary.com https://8x8.vc;
          connect-src 'self' https://*.execute-api.ap-south-1.amazonaws.com https://8x8.vc wss://*.8x8.vc https://*.ingest.sentry.io https://*.sentry.io https://cdn.jsdelivr.net;
          frame-src https://8x8.vc;
          worker-src 'self' blob:;
          child-src 'self' blob: https://8x8.vc;
          media-src 'self' blob:;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none';
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
      - key: X-Frame-Options
        value: 'DENY'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: Permissions-Policy
        value: 'camera=(self), microphone=(self), geolocation=()'
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://8x8.vc https://cdn.jsdelivr.net;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
          font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:;
          img-src 'self' data: blob: https://res.cloudinary.com https://8x8.vc;
          connect-src 'self' https://*.execute-api.ap-south-1.amazonaws.com https://8x8.vc wss://*.8x8.vc https://*.ingest.sentry.io https://*.sentry.io https://cdn.jsdelivr.net;
          frame-src https://8x8.vc;
          worker-src 'self' blob:;
          child-src 'self' blob: https://8x8.vc;
          media-src 'self' blob:;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none';
