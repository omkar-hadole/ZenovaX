<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenovaX - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#8B5CF6",
            },
          },
        },
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body class="bg-white min-h-screen">
    <nav class="bg-white border-b border-gray-200">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center">
            <h1 class="text-2xl font-bold text-purple-600">ZenovaX</h1>
          </div>

          <div class="relative" id="user-menu-container">
            <button
              id="user-menu-button"
              class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-gray-50 transition duration-300"
            >
              <div
                id="user-avatar"
                class="w-10 h-10 rounded-full bg-purple-600 text-white flex items-center justify-center font-semibold"
              >
                <span id="user-initials">U</span>
              </div>
              <span
                id="user-name"
                class="text-gray-700 font-medium hidden sm:block"
                >Loading...</span
              >
              <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
            </button>

            <div
              id="user-menu-dropdown"
              class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50"
            >
              <a
                href="#"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2"
              >
                <i data-lucide="user" class="w-4 h-4"></i>
                Profile
              </a>
              <a
                href="#"
                class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2"
              >
                <i data-lucide="settings" class="w-4 h-4"></i>
                Settings
              </a>
              <div class="border-t border-gray-200 my-1"></div>
              <button
                id="logout-btn"
                class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-50 flex items-center gap-2"
              >
                <i data-lucide="log-out" class="w-4 h-4"></i>
                Logout
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <main class="min-h-screen flex items-center justify-center py-12 px-4">
      <div class="text-center">
        <h1 class="text-6xl font-bold text-gray-900 mb-4">Dashboard</h1>
        <p id="welcome-message" class="text-xl text-gray-600 mb-8">
          Welcome back!
        </p>
        <p class="text-gray-400 text-lg">Your content will appear here</p>
      </div>
    </main>

    <script>
      lucide.createIcons();

      function getInitials(name) {
        if (!name) return "U";
        const parts = name.trim().split(" ");
        if (parts.length >= 2) {
          return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        }
        return name.substring(0, 2).toUpperCase();
      }

      function loadUserData() {
        const userStr = localStorage.getItem("user");

        if (!userStr) {
          window.location.href = "index.html";
          return;
        }

        try {
          const user = JSON.parse(userStr);
          if (!user || !user.id) {
            localStorage.removeItem("user");
            window.location.href = "index.html";
            return;
          }
          updateUI(user);
        } catch (e) {
          localStorage.removeItem("user");
          window.location.href = "index.html";
        }
      }

      function updateUI(user) {
        document.getElementById("user-name").textContent = user.name || "User";
        document.getElementById("user-initials").textContent = getInitials(
          user.name || "User"
        );
        document.getElementById(
          "welcome-message"
        ).textContent = `Welcome back, ${user.name || "User"}!`;

        if (user.profileImage) {
          const avatar = document.getElementById("user-avatar");
          avatar.classList.remove("bg-purple-600");
          avatar.innerHTML = `<img src="${user.profileImage}" alt="${user.name}" class="w-full h-full rounded-full object-cover">`;
        }
      }

      document
        .getElementById("user-menu-button")
        .addEventListener("click", (e) => {
          e.stopPropagation();
          const dropdown = document.getElementById("user-menu-dropdown");
          dropdown.classList.toggle("hidden");
        });

      document.addEventListener("click", (e) => {
        const container = document.getElementById("user-menu-container");
        if (!container.contains(e.target)) {
          document.getElementById("user-menu-dropdown").classList.add("hidden");
        }
      });

      document.getElementById("logout-btn").addEventListener("click", () => {
        localStorage.removeItem("user");
        window.location.href = "index.html";
      });

      document.addEventListener("DOMContentLoaded", () => {
        loadUserData();
      });
    </script>
  </body>
</html>
