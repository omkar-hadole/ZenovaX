<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenovaX - Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#007AFF",
            },
          },
        },
      };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

      * {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .glass-dark {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .btn-primary {
        background: rgba(0, 122, 255, 0.95);
        box-shadow: 0 4px 16px rgba(0, 122, 255, 0.3);
      }

      .btn-primary:hover {
        background: rgba(0, 122, 255, 1);
        box-shadow: 0 6px 20px rgba(0, 122, 255, 0.4);
      }

      .input-glass {
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 0, 0, 0.1);
      }

      .input-glass:focus {
        background: rgba(255, 255, 255, 0.7);
        border-color: rgba(0, 122, 255, 0.5);
      }
    </style>
  </head>

  <body
    class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen"
  >
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <div class="min-h-screen flex items-center justify-center p-4">
      <div
        class="w-full max-w-6xl glass rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row"
      >
        <div
          class="hidden md:flex md:w-1/2 bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-500 relative overflow-hidden flex-col min-h-[400px] md:min-h-[700px]"
        >
          <div class="absolute top-8 left-8 z-10">
            <h1
              class="text-3xl md:text-4xl font-light text-white tracking-tight"
            >
              ZenovaX
            </h1>
          </div>

          <div class="absolute top-8 right-8 z-10">
            <button
              class="px-4 py-2 rounded-full glass-dark text-white text-sm font-light hover:bg-white/10 transition-all duration-300 flex items-center gap-2"
            >
              Back to website
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="flex-1 flex flex-col justify-center text-white">
            <div class="relative w-full h-64 md:h-full">
              <img
                id="hero-image"
                alt="Showcase"
                class="absolute inset-0 w-full h-full object-cover transition-opacity duration-700 ease-in-out opacity-0"
              />
              <div
                class="pointer-events-none absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"
              ></div>

              <div
                id="hero-lines"
                class="absolute bottom-8 left-0 right-0 flex justify-center gap-2 z-10"
              >
                <span
                  class="seg block w-8 h-1 rounded-full bg-white/40 cursor-pointer transition-all duration-300"
                ></span>
                <span
                  class="seg block w-8 h-1 rounded-full bg-white/40 cursor-pointer transition-all duration-300"
                ></span>
                <span
                  class="seg block w-8 h-1 rounded-full bg-white/40 cursor-pointer transition-all duration-300"
                ></span>
              </div>
            </div>
          </div>
        </div>

        <div
          class="w-full md:w-1/2 bg-white/50 backdrop-blur-xl p-6 md:p-12 flex items-center justify-center"
        >
          <div class="w-full max-w-md w-full">
            <div id="login-section">
              <h2 class="text-3xl md:text-4xl font-semibold text-gray-900 mb-2">
                Welcome back
              </h2>
              <p class="text-gray-600 mb-8 font-light">
                Don't have an account?
                <a
                  href="#"
                  id="switch-to-signup"
                  class="text-blue-600 hover:text-blue-700 font-normal"
                  >Sign up</a
                >
              </p>

              <form id="login-form" class="space-y-5">
                <div>
                  <input
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="Email"
                    required
                    class="input-glass w-full px-4 py-3.5 text-gray-900 placeholder-gray-500 rounded-xl focus:ring-2 focus:ring-blue-500/30 focus:outline-none transition-all duration-300"
                  />
                  <p
                    id="login-email-error"
                    class="hidden text-sm text-red-500 mt-2"
                  ></p>
                  <p class="text-xs text-gray-500 mt-2 font-light">
                    Must end with @nst.rishihood.edu.in
                  </p>
                </div>

                <div>
                  <div class="relative">
                    <input
                      type="password"
                      id="login-password"
                      name="password"
                      placeholder="Password"
                      required
                      minlength="6"
                      class="input-glass w-full px-4 py-3.5 pr-12 text-gray-900 placeholder-gray-500 rounded-xl focus:ring-2 focus:ring-blue-500/30 focus:outline-none transition-all duration-300"
                    />
                    <button
                      type="button"
                      id="login-toggle-password"
                      class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors"
                    >
                      <i data-lucide="eye" class="w-5 h-5"></i>
                    </button>
                  </div>
                  <p
                    id="login-password-error"
                    class="hidden text-sm text-red-500 mt-2"
                  ></p>
                </div>

                <div class="flex items-center justify-between text-sm pt-1">
                  <label class="flex items-center text-gray-600 font-light">
                    <input
                      type="checkbox"
                      class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500/30"
                    />
                    <span class="ml-2">Remember me</span>
                  </label>
                  <a
                    href="#"
                    class="text-blue-600 hover:text-blue-700 font-light"
                    >Forgot password?</a
                  >
                </div>

                <button
                  type="submit"
                  id="login-submit"
                  class="btn-primary w-full text-white py-3.5 rounded-xl font-medium transition-all duration-300 transform hover:scale-[1.01] flex items-center justify-center gap-2 mt-6"
                >
                  <span id="login-submit-text">Log in</span>
                  <div
                    id="login-loading"
                    class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"
                  ></div>
                </button>
              </form>
            </div>

            <!-- Signup Form -->
            <div id="signup-section" class="hidden">
              <h2 class="text-3xl md:text-4xl font-semibold text-gray-900 mb-2">
                Create account
              </h2>
              <p class="text-gray-600 mb-8 font-light">
                Already have an account?
                <a
                  href="#"
                  id="switch-to-login"
                  class="text-blue-600 hover:text-blue-700 font-normal"
                  >Log in</a
                >
              </p>

              <form id="signup-form" class="space-y-5">
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <input
                      type="text"
                      id="signup-firstname"
                      name="firstname"
                      placeholder="First name"
                      required
                      minlength="2"
                      class="input-glass w-full px-4 py-3.5 text-gray-900 placeholder-gray-500 rounded-xl focus:ring-2 focus:ring-blue-500/30 focus:outline-none transition-all duration-300"
                    />
                    <p
                      id="signup-firstname-error"
                      class="hidden text-sm text-red-500 mt-2"
                    ></p>
                  </div>
                  <div>
                    <input
                      type="text"
                      id="signup-lastname"
                      name="lastname"
                      placeholder="Last name"
                      required
                      minlength="2"
                      class="input-glass w-full px-4 py-3.5 text-gray-900 placeholder-gray-500 rounded-xl focus:ring-2 focus:ring-blue-500/30 focus:outline-none transition-all duration-300"
                    />
                    <p
                      id="signup-lastname-error"
                      class="hidden text-sm text-red-500 mt-2"
                    ></p>
                  </div>
                </div>

                <div>
                  <input
                    type="email"
                    id="signup-email"
                    name="email"
                    placeholder="Email"
                    required
                    class="input-glass w-full px-4 py-3.5 text-gray-900 placeholder-gray-500 rounded-xl focus:ring-2 focus:ring-blue-500/30 focus:outline-none transition-all duration-300"
                  />
                  <p
                    id="signup-email-error"
                    class="hidden text-sm text-red-500 mt-2"
                  ></p>
                  <p class="text-xs text-gray-500 mt-2 font-light">
                    Must end with @nst.rishihood.edu.in
                  </p>
                </div>

                <div>
                  <div class="relative">
                    <input
                      type="password"
                      id="signup-password"
                      name="password"
                      placeholder="Password"
                      required
                      minlength="6"
                      class="input-glass w-full px-4 py-3.5 pr-12 text-gray-900 placeholder-gray-500 rounded-xl focus:ring-2 focus:ring-blue-500/30 focus:outline-none transition-all duration-300"
                    />
                    <button
                      type="button"
                      id="signup-toggle-password"
                      class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors"
                    >
                      <i data-lucide="eye" class="w-5 h-5"></i>
                    </button>
                  </div>
                  <p
                    id="signup-password-error"
                    class="hidden text-sm text-red-500 mt-2"
                  ></p>
                  <p class="text-xs text-gray-500 mt-2 font-light">
                    Minimum 6 characters
                  </p>
                </div>

                <div>
                  <div class="relative">
                    <input
                      type="password"
                      id="signup-confirm-password"
                      name="confirm-password"
                      placeholder="Confirm password"
                      required
                      minlength="6"
                      class="input-glass w-full px-4 py-3.5 pr-12 text-gray-900 placeholder-gray-500 rounded-xl focus:ring-2 focus:ring-blue-500/30 focus:outline-none transition-all duration-300"
                    />
                    <button
                      type="button"
                      id="signup-toggle-confirm-password"
                      class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors"
                    >
                      <i data-lucide="eye" class="w-5 h-5"></i>
                    </button>
                  </div>
                  <p
                    id="signup-confirm-password-error"
                    class="hidden text-sm text-red-500 mt-2"
                  ></p>
                </div>

                <label class="flex items-start text-gray-600 font-light">
                  <input
                    type="checkbox"
                    id="signup-terms"
                    required
                    class="mt-1 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500/30"
                  />
                  <span class="ml-2 text-sm">
                    I agree to the
                    <a
                      href="#"
                      class="text-blue-600 hover:text-blue-700 font-normal"
                      >Terms & Conditions</a
                    >
                  </span>
                </label>

                <button
                  type="submit"
                  id="signup-submit"
                  class="btn-primary w-full text-white py-3.5 rounded-xl font-medium transition-all duration-300 transform hover:scale-[1.01] flex items-center justify-center gap-2 mt-6"
                >
                  <span id="signup-submit-text">Create account</span>
                  <div
                    id="signup-loading"
                    class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"
                  ></div>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:3001/api";

      lucide.createIcons();

      function showToast(message, type = "success") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        const bgColor = type === "success" ? "bg-green-500" : "bg-red-500";
        toast.className = `${bgColor} text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-2`;
        toast.style.backdropFilter = "blur(10px)";
        toast.innerHTML = `
                <i data-lucide="${
                  type === "success" ? "check" : "x"
                }" class="w-5 h-5"></i>
                <span class="font-light">${message}</span>
            `;
        container.appendChild(toast);
        lucide.createIcons();

        setTimeout(() => {
          toast.style.opacity = "0";
          toast.style.transition = "opacity 0.3s";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      const loginSection = document.getElementById("login-section");
      const signupSection = document.getElementById("signup-section");
      const switchToSignup = document.getElementById("switch-to-signup");
      const switchToLogin = document.getElementById("switch-to-login");

      function showLogin() {
        loginSection.classList.remove("hidden");
        signupSection.classList.add("hidden");
      }

      function showSignup() {
        signupSection.classList.remove("hidden");
        loginSection.classList.add("hidden");
      }

      switchToSignup?.addEventListener("click", (e) => {
        e.preventDefault();
        showSignup();
      });
      switchToLogin?.addEventListener("click", (e) => {
        e.preventDefault();
        showLogin();
      });

      function setupPasswordToggle(buttonId, inputId) {
        const button = document.getElementById(buttonId);
        const input = document.getElementById(inputId);
        const icon = button.querySelector("i");

        button.addEventListener("click", () => {
          const isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";
          icon.setAttribute("data-lucide", isPassword ? "eye-off" : "eye");
          lucide.createIcons();
        });
      }

      setupPasswordToggle("login-toggle-password", "login-password");
      setupPasswordToggle("signup-toggle-password", "signup-password");
      setupPasswordToggle(
        "signup-toggle-confirm-password",
        "signup-confirm-password"
      );

      (function initHeroCarousel() {
        const images = [
          "https://images.pexels.com/photos/10643964/pexels-photo-10643964.jpeg",
          "https://images.pexels.com/photos/5011647/pexels-photo-5011647.jpeg",
          "https://images.pexels.com/photos/8347499/pexels-photo-8347499.jpeg",
        ];
        const imgEl = document.getElementById("hero-image");
        const linesContainer = document.getElementById("hero-lines");
        const segments = linesContainer
          ? Array.from(linesContainer.querySelectorAll(".seg"))
          : [];
        let idx = 0;

        function setActiveSegment(i) {
          segments.forEach((s, si) => {
            if (si === i) {
              s.classList.remove("bg-white/40");
              s.classList.add("bg-white", "w-12");
            } else {
              s.classList.remove("bg-white", "w-12");
              s.classList.add("bg-white/40");
            }
          });
        }

        function showImage(i) {
          const next = new Image();
          next.src = images[i];
          next.onload = () => {
            imgEl.classList.add("opacity-0");
            setTimeout(() => {
              imgEl.src = images[i];
              imgEl.classList.remove("opacity-0");
            }, 200);
            setActiveSegment(i);
          };
        }

        if (imgEl) {
          imgEl.src = images[0];
          imgEl.classList.remove("opacity-0");
          setActiveSegment(0);
        }

        setInterval(() => {
          idx = (idx + 1) % images.length;
          showImage(idx);
        }, 4000);

        segments.forEach((s, si) =>
          s.addEventListener("click", () => {
            idx = si;
            showImage(idx);
          })
        );
      })();

      function validateEmail(email) {
        return email.endsWith("@nst.rishihood.edu.in") && email.includes("@");
      }

      document
        .getElementById("login-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const email = document.getElementById("login-email").value.trim();
          const password = document.getElementById("login-password").value;
          const submitBtn = document.getElementById("login-submit");
          const submitText = document.getElementById("login-submit-text");
          const loading = document.getElementById("login-loading");

          if (!validateEmail(email)) {
            showToast("Email must end with @nst.rishihood.edu.in", "error");
            return;
          }

          if (password.length < 6) {
            showToast("Password must be at least 6 characters", "error");
            return;
          }

          submitBtn.disabled = true;
          submitText.classList.add("hidden");
          loading.classList.remove("hidden");

          try {
            const res = await fetch(`${API_URL}/auth/login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            const data = await res.json();

            if (!res.ok) {
              throw new Error(data.error || "Login failed");
            }

            localStorage.setItem("user", JSON.stringify(data.user));

            showToast("Login successful!", "success");

            setTimeout(() => {
              window.location.href = "dashboard.html";
            }, 600);
          } catch (err) {
            showToast(
              err.message || "Network error. Check if server is running",
              "error"
            );
          } finally {
            submitBtn.disabled = false;
            submitText.classList.remove("hidden");
            loading.classList.add("hidden");
          }
        });

      document
        .getElementById("signup-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const firstname = document
            .getElementById("signup-firstname")
            .value.trim();
          const lastname = document
            .getElementById("signup-lastname")
            .value.trim();
          const name = `${firstname} ${lastname}`;
          const email = document.getElementById("signup-email").value.trim();
          const password = document.getElementById("signup-password").value;
          const confirmPassword = document.getElementById(
            "signup-confirm-password"
          ).value;
          const submitBtn = document.getElementById("signup-submit");
          const submitText = document.getElementById("signup-submit-text");
          const loading = document.getElementById("signup-loading");

          if (firstname.length < 2) {
            showToast("First name must be at least 2 characters", "error");
            return;
          }

          if (lastname.length < 2) {
            showToast("Last name must be at least 2 characters", "error");
            return;
          }

          if (!validateEmail(email)) {
            showToast("Email must end with @nst.rishihood.edu.in", "error");
            return;
          }

          if (password.length < 6) {
            showToast("Password must be at least 6 characters", "error");
            return;
          }

          if (password !== confirmPassword) {
            showToast("Passwords do not match", "error");
            return;
          }

          submitBtn.disabled = true;
          submitText.classList.add("hidden");
          loading.classList.remove("hidden");

          try {
            const res = await fetch(`${API_URL}/auth/register`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ name, email, password }),
            });

            const data = await res.json();

            if (!res.ok) {
              throw new Error(data.error || "Registration failed");
            }

            localStorage.setItem("user", JSON.stringify(data.user));

            showToast("Account created successfully!", "success");

            setTimeout(() => {
              window.location.href = "dashboard.html";
            }, 600);
          } catch (err) {
            showToast(
              err.message || "Network error. Check if server is running",
              "error"
            );
          } finally {
            submitBtn.disabled = false;
            submitText.classList.remove("hidden");
            loading.classList.add("hidden");
          }
        });

      document.addEventListener("DOMContentLoaded", () => {
        const userStr = localStorage.getItem("user");
        if (userStr) {
          try {
            const user = JSON.parse(userStr);
            if (user && user.id) {
              window.location.href = "dashboard.html";
            }
          } catch (e) {
            localStorage.removeItem("user");
          }
        }
      });
    </script>
  </body>
</html>
